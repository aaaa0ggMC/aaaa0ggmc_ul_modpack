buildscript {
    repositories {
        maven { url = "https://files.minecraftforge.net/maven" }
        maven { url = "https://repo.maven.apache.org/maven2" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0.0"
group = "aaaa0ggmc"
archivesBaseName = "aaaa0ggmc_ul_modpack"

sourceCompatibility = targetCompatibility = "1.8"
compileJava.options.encoding = "UTF-8"

minecraft {
    // 与 morphext 系一致：开发用 2847（只有它在 Forge maven 上发布了 userdev 产物）。
    // 编译产物在 2860 运行时通用（1.12.2 Forge API 稳定）。
    version = "1.12.2-14.23.5.2847"
    mappings = "stable_39"
    runDir = "run"
}

repositories {
    maven { url = "https://repo.maven.apache.org/maven2" }
}

dependencies {
    // UL 强度设计层 —— 全包可调数值统一入口（UlStrength）
    def strengthDev = file("../ul-strength-design/build/libs/ul-strength-design-1.0.0-dev.jar")
    compile files(strengthDev.exists() ? strengthDev : "libs/ul-strength-design-1.0.0.jar")
    // Baubles —— 安卡护符的 AMULET（脖子）槽位
    compile files("libs/Baubles-1.12-1.5.2.jar")
    // Metamorph —— 感染变身的形态引擎（MorphAPI/MorphManager）
    compile files("libs/metamorph-1.4-1.12.2.jar")
    // morphext —— 整合包能力/玩家数据层（感染状态记录）
    def morphExtDev = file("../morph-extension/build/libs/morph-extension-1.0.0-dev.jar")
    compile files(morphExtDev.exists() ? morphExtDev : "libs/morph-extension-1.0.0.jar")
    compile files("libs/mclib-2.4.3-1.12.2.jar")
    // FTB Quests（1202 fork）+ FTBLib —— 形态检测任务注入
    testCompile "junit:junit:4.13.2"
    compile files("libs/FTBQuests-1202.9.0.15.jar")
    compile files("libs/FTBLib-5.4.7.2.jar")
    // MixinBooter —— 原版生物硬编码玩家检测的逐生物 Mixin 注入载体
    compile files("libs/mixinbooter-12.2.jar")
}

jar {
    manifest {
        attributes(
            // coremod 化：让 jar 早期进 LaunchClassLoader，manifest MixinConfigs 的
            // 资源读取才有着落；配置加载本身由 UlModpackLoadingPlugin(IEarlyMixinLoader) 负责
            'FMLCorePlugin': 'aaaa0ggmc.ulmodpack.loader.UlModpackLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod': 'true'
        )
    }
    finalizedBy 'reobfJar'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": "1.12.2"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }

    // 数据外置（2026-11-07）：texts/ 与 strengths/normal/ 是仓库里的唯一真值源，
    // jar 内 assets/<modid>/... 的副本由这里生成，只作「没装外置文件时」的离线兜底：
    //   texts/<modid>/lang/<locale>.lang        -> assets/<modid>/lang/<LOCALE>.lang
    //   strengths/normal/<modid>/**             -> assets/<modid>/**
    //
    // 【jar 内 lang 文件名必须大写（en_US.lang / zh_CN.lang）——2026-11-07 实测教训】
    // texts/ 里用小写只是源码目录规范；jar 内必须还原成大写，否则 MC 1.12.2 实际查找的
    // 名字对不上、Linux + ZIP 大小写敏感 → 整份 lang miss（玩家看到全是原始 key）。
    // 证据：texts/ 外置之前 jar 里一直是大写 en_US.lang 且工作正常；改成小写后立刻全变 key
    // （2026-11-07 用户实测，两张截图对比；且 ZipFile.getEntry 证明小写条目本身是命中的，
    //  说明问题不在 jar 内容而在 MC 侧查找名）。texts/ 仅作收集中心，命名转换在这里做。
    from('texts') {
        into 'assets'
        rename { String name ->
            name.replace('en_us.lang', 'en_US.lang').replace('zh_cn.lang', 'zh_CN.lang')
        }
    }
    from('strengths/normal/aaaa0ggmc_ul_modpack') {
        into 'assets/aaaa0ggmc_ul_modpack/ul_strength'
    }
}
